<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RDX, LLC | A Biomedical Device Company. Website coming soon.">
  <meta name="theme-color" content="#161b1d">
  <title>RDX, LLC | A Biomedical Device Company</title>
  <link rel="icon" href="rdx-shield.svg" type="image/svg+xml">
  <link rel="preload" href="device-detail.jpg" as="image">
  <style>
    :root {
      color-scheme: dark;
      color: #fff;
      background: #161b1d;
      font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    .cover {
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(20px, 3vw, 48px);
      padding-bottom: max(clamp(24px, 4.5vh, 58px), env(safe-area-inset-bottom));
      background:
        linear-gradient(180deg, #1014163b, #1014165e 51%, #101416b8),
        url("device-detail.jpg") 54% center / cover no-repeat,
        #161b1d;
    }
    header { align-self: start; }
    header img { display: block; width: clamp(29px, 3vw, 44px); height: auto; }
    main {
      align-self: center;
      text-align: center;
      text-shadow: 0 2px 18px #000b;
    }
    h1 { margin: 0; }
    h1 img {
      display: block;
      width: clamp(158px, 18vw, 232px);
      height: auto;
      margin-inline: auto;
      filter: drop-shadow(0 2px 12px #0007);
    }
    main p {
      margin: 13px 0 0;
      color: #e1e8ec;
      font-size: clamp(.75rem, 1.2vw, .875rem);
      font-weight: 500;
      line-height: 1.5;
      letter-spacing: .085em;
    }
    main p::before {
      content: "";
      display: block;
      width: 22px;
      height: 1px;
      margin: 0 auto 12px;
      background: #7ce4ff;
    }
    footer { align-self: end; text-align: center; }
    footer p { margin: 0; color: #d9e0e4; font-size: .75rem; letter-spacing: .04em; text-shadow: 0 2px 12px #000; }
    @media (orientation: portrait) {
      .cover { background-position: center, 76% center, center; }
    }
    @media (max-height: 360px) {
      .cover { row-gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="cover">
    <header>
      <img src="rdx-shield.svg" alt="" width="49" height="56">
    </header>
    <main>
      <h1><img src="rdx-wordmark-white.svg" alt="RDX, LLC" width="208" height="72"></h1>
      <p>A Biomedical Device Company</p>
    </main>
    <footer>
      <p>Website coming soon.</p>
    </footer>
  </div>
</body>
</html>
